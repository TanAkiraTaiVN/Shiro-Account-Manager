name: Release Shiro

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies (locked)
        shell: pwsh
        run: dotnet restore "Shiro.sln" --runtime win-x64 --locked-mode

      - name: Run Unit Tests & Coverage Gate
        shell: pwsh
        run: |
          dotnet test "tests/Shiro.Tests/Shiro.Tests.csproj" --configuration Release --no-restore --collect:"XPlat Code Coverage" --settings "tests/coverage.runsettings" --results-directory "coverage" --logger "console;verbosity=normal"
          ./scripts/Check-Coverage.ps1 -CoverageDir "coverage" -MinOverall 75.0 -MinBranch 60.0 -MinCore 92.0

      - name: Publish single-file win-x64
        shell: pwsh
        run: >-
          dotnet publish "src/Shiro/Shiro.csproj"
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output "build/Release"
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true

      - name: Package Release ZIP and Compute SHA-256 Checksums
        shell: pwsh
        run: |
          Set-Location build/Release
          $exe = Get-ChildItem -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "Published executable not found in build/Release"
          }
          Compress-Archive -Path $exe.FullName -DestinationPath "Shiro-win-x64.zip" -Force
          $zip = Get-Item -LiteralPath "Shiro-win-x64.zip"
          $exeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe.FullName).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip.FullName).Hash.ToLowerInvariant()
          $lines = @(
            "$exeHash *$($exe.Name)",
            "$zipHash *$($zip.Name)"
          )
          [System.IO.File]::WriteAllLines((Join-Path (Get-Location) "SHA256SUMS.txt"), $lines, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Generated SHA256 for $($exe.Name): $exeHash"
          Write-Host "Generated SHA256 for $($zip.Name): $zipHash"

      - name: Generate Build Provenance Attestation
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            build/Release/*.exe
            build/Release/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            build/Release/*.exe
            build/Release/*.zip
            build/Release/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
