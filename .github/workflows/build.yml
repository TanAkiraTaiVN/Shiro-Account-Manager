name: Build Shiro

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore "RBX Alt Manager/RBX Alt Manager.csproj" --runtime win-x64
          dotnet restore "tests/RBX_Alt_Manager.Tests/RBX_Alt_Manager.Tests.csproj" --runtime win-x64

      - name: Build
        shell: pwsh
        run: |
          dotnet build "RBX Alt Manager/RBX Alt Manager.csproj" --configuration Release --no-restore
          dotnet build "tests/RBX_Alt_Manager.Tests/RBX_Alt_Manager.Tests.csproj" --configuration Release --no-restore

      - name: Run Unit Tests
        shell: pwsh
        run: dotnet test "tests/RBX_Alt_Manager.Tests/RBX_Alt_Manager.Tests.csproj" --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Verify architecture boundaries
        shell: pwsh
        run: |
          $batch = Get-Content -Raw "RBX Alt Manager/Classes/Batch.cs"
          if ($batch -match "Task\.Run") {
            throw "Batch image/place requests must remain async without a thread-pool wrapper."
          }

          $process = Get-Content -Raw "RBX Alt Manager/Classes/RobloxProcess.cs"
          if ($process -match "Task\.Run\(WaitForLogPath") {
            throw "Roblox log lookup still uses the removed blocking Task.Run path."
          }

          $sourceFiles = Get-ChildItem "RBX Alt Manager" -Recurse -Filter "*.cs" -File
          $legacyNetworking = $sourceFiles | Select-String -Pattern "\b(WebClient|WebRequest|HttpWebRequest)\b"
          if ($legacyNetworking) {
            throw "Legacy WebClient/WebRequest usage remains: $($legacyNetworking -join '; ')"
          }

          if (-not (Select-String -Path "RBX Alt Manager/Services/AccountDataSerializer.cs" -Pattern "CurrentSchemaVersion")) {
            throw "Versioned account data serializer is missing."
          }

          if (-not (Select-String -Path "RBX Alt Manager/Services/StoragePaths.cs" -Pattern "IsWithinDirectory")) {
            throw "Browser profile cleanup is missing its storage boundary."
          }

          if (-not (Select-String -Path "RBX Alt Manager/Services/AccountDataSerializer.cs" -Pattern "includePasswords")) {
            throw "SavePasswords must be enforced while serializing account data."
          }

          if (Select-String -Path "RBX Alt Manager/Classes/Program.cs" -Pattern "NET Framework 4\.7\.2") {
            throw "The .NET Framework 4.7.2 runtime check is obsolete for the .NET 10 self-contained build."
          }

      - name: Publish single-file win-x64
        shell: pwsh
        run: >-
          dotnet publish "RBX Alt Manager/RBX Alt Manager.csproj"
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output "build/Release"
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true

      - name: Verify release layout
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -LiteralPath "build/Release" -Filter "*.exe" -File)
          if ($executables.Count -ne 1) {
            throw "Expected exactly one release EXE, found $($executables.Count)."
          }
          if ($executables[0].Name -ne "Roblox Account Manager.exe") {
            throw "Unexpected release executable: $($executables[0].Name)"
          }

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiro-win-x64
          path: build/Release/
          if-no-files-found: error
