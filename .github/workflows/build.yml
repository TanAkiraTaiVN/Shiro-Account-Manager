name: Build Shiro

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore "Shiro.sln" --runtime win-x64 --locked-mode

      - name: Build
        shell: pwsh
        run: dotnet build "Shiro.sln" --configuration Release --no-restore

      - name: Run Unit Tests & Collect Coverage
        shell: pwsh
        run: >-
          dotnet test "tests/Shiro.Tests/Shiro.Tests.csproj"
          --configuration Release
          --no-restore
          --collect:"XPlat Code Coverage"
          --settings "tests/coverage.runsettings"
          --results-directory "coverage"
          --logger "console;verbosity=normal"

      - name: Enforce Coverage Gate
        shell: pwsh
        run: ./scripts/Check-Coverage.ps1 -CoverageDir "coverage" -MinOverall 60.0 -MinCore 90.0

      - name: Verify architecture boundaries
        shell: pwsh
        run: |
          $batch = Get-Content -Raw "src/Shiro/Classes/Batch.cs"
          if ($batch -match "Task\.Run") {
            throw "Batch image/place requests must remain async without a thread-pool wrapper."
          }

          $process = Get-Content -Raw "src/Shiro/Classes/RobloxProcess.cs"
          if ($process -match "Task\.Run\(WaitForLogPath") {
            throw "Roblox log lookup still uses the removed blocking Task.Run path."
          }

          $sourceFiles = Get-ChildItem "src/Shiro" -Recurse -Filter "*.cs" -File
          $legacyNetworking = $sourceFiles | Select-String -Pattern "\b(WebClient|WebRequest|HttpWebRequest)\b"
          if ($legacyNetworking) {
            throw "Legacy WebClient/WebRequest usage remains: $($legacyNetworking -join '; ')"
          }

          if (-not (Select-String -Path "src/Shiro/Services/Storage/AccountDataSerializer.cs" -Pattern "CurrentSchemaVersion")) {
            throw "Versioned account data serializer is missing."
          }

          if (-not (Select-String -Path "src/Shiro/Services/Storage/StoragePaths.cs" -Pattern "IsWithinDirectory")) {
            throw "Browser profile cleanup is missing its storage boundary."
          }

          if (-not (Select-String -Path "src/Shiro/Services/Storage/AccountDataSerializer.cs" -Pattern "includePasswords")) {
            throw "SavePasswords must be enforced while serializing account data."
          }

          if (Select-String -Path "src/Shiro/Classes/Program.cs" -Pattern "NET Framework 4\.7\.2") {
            throw "The .NET Framework 4.7.2 runtime check is obsolete for the .NET 10 self-contained build."
          }

      - name: Publish single-file win-x64
        shell: pwsh
        run: >-
          dotnet publish "src/Shiro/Shiro.csproj"
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output "build/Release"
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true

      - name: Verify release layout
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -LiteralPath "build/Release" -Filter "*.exe" -File)
          if ($executables.Count -lt 1) {
            throw "Expected release EXE, found none."
          }
          if (-not (Test-Path "build/Release/Shiro.exe")) {
            throw "Expected release executable 'Shiro.exe' to exist."
          }

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiro-win-x64
          path: build/Release/
          if-no-files-found: error
