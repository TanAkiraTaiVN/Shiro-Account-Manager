name: Build Shiro

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.102'

      - name: Restore
        shell: pwsh
        run: dotnet restore "Shiro.sln" --runtime win-x64 /p:SelfContained=true --locked-mode

      - name: Build
        shell: pwsh
        run: dotnet build "Shiro.sln" --configuration Release --no-restore --nologo -warnaserror

      - name: Run Unit Tests & Collect Coverage
        shell: pwsh
        run: >-
          dotnet test "tests/Shiro.Tests/Shiro.Tests.csproj"
          --configuration Release
          --no-restore
          --collect:"XPlat Code Coverage"
          --settings "tests/coverage.runsettings"
          --results-directory "coverage"
          --logger "console;verbosity=normal"

      - name: Enforce Coverage Gate
        shell: pwsh
        run: ./scripts/Check-Coverage.ps1 -CoverageDir "coverage" -MinOverall 75.0 -MinBranch 60.0 -MinCore 92.0

      - name: Upload coverage on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-failure-logs
          path: coverage/
          if-no-files-found: ignore

      - name: Publish single-file win-x64
        shell: pwsh
        run: >-
          dotnet publish "src/Shiro/Shiro.csproj"
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output "build/Release"
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true

      - name: Verify release layout
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -LiteralPath "build/Release" -Filter "*.exe" -File)
          if ($executables.Count -lt 1) {
            throw "Expected release EXE, found none."
          }
          if (-not (Test-Path "build/Release/Shiro.exe")) {
            throw "Expected release executable 'Shiro.exe' to exist."
          }

      - name: Upload release artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: shiro-win-x64
          path: build/Release/
          if-no-files-found: error
