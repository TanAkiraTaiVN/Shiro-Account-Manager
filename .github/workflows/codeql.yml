name: "CodeQL Security Analysis"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '30 2 * * 1'

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b56ba49e26e50534fa0efd2f772af6ef26c6244b # v3.28.10
        with:
          languages: csharp
          build-mode: manual

      - name: Build solution
        run: dotnet build Shiro.sln --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b56ba49e26e50534fa0efd2f772af6ef26c6244b # v3.28.10
        with:
          category: "/language:csharp"
